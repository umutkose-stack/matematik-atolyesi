name: Siteyi yayınla

# dist/ klasörünü sitenin kökü olarak GitHub Pages'e yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Paketi hazırlar. Yayın ayrı bir işte yapılır: ikisi aynı işteyken yayın adımı bazen
  # paket henüz listelenmeden çalışıyor ve "No artifacts named github-pages" hatası veriyordu.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
